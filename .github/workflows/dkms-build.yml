name: Build DKMS Packages

on:
  push:
    branches: [ main, cix_mainline_dev ]
  pull_request:
    branches: [ main, cix_mainline_dev ]
  workflow_dispatch:
  release:
    types: [ created ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      deb_name: ${{ steps.version.outputs.deb_name }}

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git-buildpackage \
            debhelper \
            devscripts \
            dpkg-dev \
            fakeroot \
            dh-dkms \
            dh-exec \
            build-essential \
            sudo

      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug git status
        run: |
          pwd
          ls -la
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git status
          ls -la .git/ || echo "No .git dir"

      - name: Get version from debian/changelog
        id: version
        run: |
          VERSION=$(dpkg-parsechangelog -S Version)
          DEB_NAME=$(dpkg-parsechangelog -S Source)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "deb_name=${DEB_NAME}" >> $GITHUB_OUTPUT
          echo "Building ${DEB_NAME} version ${VERSION}"

      - name: Build DKMS packages
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          cd "${GITHUB_WORKSPACE}"
          pwd
          git status
          gbp buildpackage \
            --git-ignore-branch \
            --git-builder='debuild --no-lintian -uc -us -b' \
            --git-export-dir="${GITHUB_WORKSPACE}/../build-area"

      - name: Move artifacts
        run: |
          mkdir -p /tmp/debs
          mv "${GITHUB_WORKSPACE}/../build-area"/*.deb /tmp/debs/ || true
          ls -lh /tmp/debs/

      - name: Upload artifacts (push/PR)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.deb_name }}-${{ steps.version.outputs.version }}
          path: /tmp/debs/*.deb
          retention-days: 30

      - name: Upload to release (on release)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/debs/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
